name: Deploy to itch.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.2"

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot_bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/godot_bin"

          curl -L -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          unzip "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot_bin"
          chmod +x "$RUNNER_TEMP/godot_bin/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64"

          curl -L -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          unzip "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot_templates"
          TEMPLATE_VER=$(cat "$RUNNER_TEMP/godot_templates/templates/version.txt")
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATE_VER"
          cp "$RUNNER_TEMP/godot_templates/templates/"* "$HOME/.local/share/godot/export_templates/$TEMPLATE_VER/"

      - name: Export Web build
        run: |
          GODOT="$RUNNER_TEMP/godot_bin/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64"
          mkdir -p build/Web
          "$GODOT" --headless --export-release "Web" build/Web/index.html

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl -L -o butler.zip "https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip"
          unzip -o butler.zip
          chmod +x linux-amd64/butler
          linux-amd64/butler push ./build/Web dinocrys/space-jumper:html5 \
            --userversion "$(git rev-parse --short HEAD)"
