<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#141628"/>
  <!-- Left wall -->
  <rect x="8" y="20" width="24" height="88" rx="4" fill="#6A7FD4"/>
  <!-- Right wall -->
  <rect x="96" y="20" width="24" height="88" rx="4" fill="#6A7FD4"/>
  <!-- Player (jumping figure) -->
  <circle cx="64" cy="60" r="12" fill="#F5A623"/>
  <!-- Jump arc arrow -->
  <path d="M 52 75 Q 36 50 52 35 Q 62 25 76 35 Q 90 50 76 72" 
